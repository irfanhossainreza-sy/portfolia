<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgWeather)"/>

  <!-- Chrome Bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="#0f172a" opacity="0.8"/>
  <circle cx="55" cy="45" r="6" fill="#ef4444"/>
  <circle cx="75" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="45" r="6" fill="#10b981"/>
  <rect x="130" y="35" width="380" height="20" rx="6" fill="#1e293b"/>
  <text x="145" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">https://weatherpulse.app/city/london</text>

  <!-- Weather Hero Display -->
  <g transform="translate(50, 85)">
    <!-- Main Left Display -->
    <rect x="0" y="0" width="410" height="260" rx="16" fill="url(#glassCard)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Location search bar inside app -->
    <rect x="25" y="20" width="360" height="36" rx="18" fill="#0f172a" opacity="0.5"/>
    <text x="50" y="43" fill="#bae6fd" font-family="sans-serif" font-size="12">🔍 Search city (e.g. London, New York, Tokyo)...</text>
    
    <!-- Big Temperature & Weather Icon -->
    <circle cx="90" cy="135" r="38" fill="url(#sunGrad)"/>
    <!-- Cloud shape overlapping sun -->
    <path d="M70 145 A 25 25 0 0 1 115 130 A 20 20 0 0 1 145 145 A 15 15 0 0 1 135 165 L 75 165 A 15 15 0 0 1 70 145 Z" fill="#ffffff" opacity="0.9"/>

    <text x="175" y="130" fill="#ffffff" font-family="sans-serif" font-size="54" font-weight="700">22°C</text>
    <text x="175" y="155" fill="#bae6fd" font-family="sans-serif" font-size="15" font-weight="500">Partly Cloudy • London, UK</text>

    <!-- Metrics row -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#0f172a" opacity="0.4"/>
      <text x="15" y="22" fill="#7dd3fc" font-family="sans-serif" font-size="10">WIND</text>
      <text x="15" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">14 km/h</text>

      <rect x="125" y="0" width="110" height="50" rx="8" fill="#0f172a" opacity="0.4"/>
      <text x="140" y="22" fill="#7dd3fc" font-family="sans-serif" font-size="10">HUMIDITY</text>
      <text x="140" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">62%</text>

      <rect x="250" y="0" width="110" height="50" rx="8" fill="#0f172a" opacity="0.4"/>
      <text x="265" y="22" fill="#7dd3fc" font-family="sans-serif" font-size="10">UV INDEX</text>
      <text x="265" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">4 Moderate</text>
    </g>
  </g>

  <!-- Right Side: 5-Day Forecast -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="270" height="260" rx="16" fill="url(#glassCard)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">5-Day Forecast</text>

    <!-- Forecast Items -->
    <g transform="translate(20, 50)">
      <text x="0" y="20" fill="#e0f2fe" font-family="sans-serif" font-size="12">Mon</text>
      <circle cx="80" cy="16" r="10" fill="#fbbf24"/>
      <text x="180" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">24° / 15°</text>

      <text x="0" y="60" fill="#e0f2fe" font-family="sans-serif" font-size="12">Tue</text>
      <circle cx="80" cy="56" r="10" fill="#94a3b8"/>
      <text x="180" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">19° / 12°</text>

      <text x="0" y="100" fill="#e0f2fe" font-family="sans-serif" font-size="12">Wed</text>
      <circle cx="80" cy="96" r="10" fill="#38bdf8"/>
      <text x="180" y="100" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">21° / 14°</text>

      <text x="0" y="140" fill="#e0f2fe" font-family="sans-serif" font-size="12">Thu</text>
      <circle cx="80" cy="136" r="10" fill="#fbbf24"/>
      <text x="180" y="140" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">25° / 16°</text>

      <text x="0" y="180" fill="#e0f2fe" font-family="sans-serif" font-size="12">Fri</text>
      <circle cx="80" cy="176" r="10" fill="#fbbf24"/>
      <text x="180" y="180" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">26° / 17°</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(50, 365)">
    <rect x="0" y="0" width="700" height="95" rx="14" fill="#0f172a" opacity="0.6"/>
    <text x="25" y="32" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">TECH HIGHLIGHTS</text>
    <text x="25" y="58" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="500">JavaScript Fetch API with Async/Await & Dynamic DOM Manipulation</text>
    <text x="25" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Real-time geolocation detection, CSS Glassmorphism effects, responsive mobile design</text>
  </g>
</svg>
