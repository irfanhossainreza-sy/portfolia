<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFintech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardFintech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgFintech)"/>
  
  <!-- Browser Chrome Header -->
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1f2937" opacity="0.9"/>
  <circle cx="55" cy="50" r="6" fill="#ef4444"/>
  <circle cx="75" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="50" r="6" fill="#10b981"/>
  <rect x="130" y="40" width="400" height="20" rx="6" fill="#111827" opacity="0.8"/>
  <text x="145" y="54" fill="#9ca3af" font-family="sans-serif" font-size="11">https://nexuspay.io/dashboard</text>

  <!-- Left Side: Credit Card & Quick Stats -->
  <g transform="translate(50, 95)">
    <!-- Credit Card -->
    <rect x="0" y="0" width="310" height="185" rx="16" fill="url(#cardFintech)"/>
    <circle cx="270" cy="40" r="16" fill="#ffffff" opacity="0.3"/>
    <circle cx="250" cy="40" r="16" fill="#ffffff" opacity="0.3"/>
    <text x="25" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">NexusPay Business</text>
    <text x="25" y="105" fill="#f3f4f6" font-family="monospace" font-size="18" letter-spacing="3">4921 •••• •••• 8839</text>
    <text x="25" y="150" fill="#e5e7eb" font-family="sans-serif" font-size="10">CARD HOLDER</text>
    <text x="25" y="166" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">IRFAN HOSSAIN</text>
    <text x="220" y="150" fill="#e5e7eb" font-family="sans-serif" font-size="10">EXPIRES</text>
    <text x="220" y="166" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">09/28</text>

    <!-- Quick stats cards below -->
    <rect x="0" y="205" width="145" height="85" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="15" y="230" fill="#9ca3af" font-family="sans-serif" font-size="11">Total Revenue</text>
    <text x="15" y="258" fill="#f9fafb" font-family="sans-serif" font-size="18" font-weight="700">$48,290</text>
    <text x="15" y="278" fill="#10b981" font-family="sans-serif" font-size="11">+18.4% this mo</text>

    <rect x="165" y="205" width="145" height="85" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="180" y="230" fill="#9ca3af" font-family="sans-serif" font-size="11">Active Clients</text>
    <text x="180" y="258" fill="#f9fafb" font-family="sans-serif" font-size="18" font-weight="700">1,248</text>
    <text x="180" y="278" fill="#38bdf8" font-family="sans-serif" font-size="11">+92 new users</text>
  </g>

  <!-- Right Side: Revenue Wave Chart & Transactions -->
  <g transform="translate(390, 95)">
    <rect x="0" y="0" width="370" height="290" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="20" y="32" fill="#f9fafb" font-family="sans-serif" font-weight="700" font-size="15">Cashflow Analytics</text>
    <rect x="270" y="16" width="80" height="24" rx="6" fill="#374151"/>
    <text x="282" y="32" fill="#d1d5db" font-family="sans-serif" font-size="10">Last 30 Days</text>

    <!-- Area Chart -->
    <path d="M20 180 Q 80 110, 140 140 T 260 90 T 350 70 L 350 200 L 20 200 Z" fill="url(#chartGrad)"/>
    <path d="M20 180 Q 80 110, 140 140 T 260 90 T 350 70" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- Transactions list -->
    <text x="20" y="225" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">RECENT TRANSACTIONS</text>
    
    <circle cx="35" cy="255" r="12" fill="#1e3a8a"/>
    <text x="55" y="253" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="600">Stripe Payment</text>
    <text x="55" y="267" fill="#9ca3af" font-family="sans-serif" font-size="10">Design Subscription</text>
    <text x="300" y="260" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="600">+$1,450.00</text>
  </g>

  <!-- Bottom status pill -->
  <g transform="translate(45, 410)">
    <rect x="0" y="0" width="715" height="40" rx="8" fill="#1e293b"/>
    <circle cx="25" cy="20" r="5" fill="#10b981"/>
    <text x="40" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="11">Bootstrap 5 • Modern CSS Grid • Flexbox • Interactive Chart.js Integration</text>
  </g>
</svg>
