<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrypto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021a14"/>
    </linearGradient>
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCrypto)"/>

  <!-- Chrome Bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="#064e3b" opacity="0.8"/>
  <circle cx="55" cy="45" r="6" fill="#ef4444"/>
  <circle cx="75" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="45" r="6" fill="#10b981"/>
  <rect x="130" y="35" width="380" height="20" rx="6" fill="#022c22"/>
  <text x="145" y="49" fill="#6ee7b7" font-family="sans-serif" font-size="11">https://cryptotrack-live.network</text>

  <!-- Left: Live Price & Wave Chart -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="430" height="370" rx="14" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <circle cx="35" cy="40" r="15" fill="#f59e0b"/>
    <text x="29" y="46" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">₿</text>
    <text x="60" y="38" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">Bitcoin</text>
    <text x="60" y="52" fill="#a7f3d0" font-family="sans-serif" font-size="11">BTC / USDT</text>

    <text x="25" y="105" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700">$94,820.50</text>
    <rect x="230" y="82" width="75" height="26" rx="6" fill="#065f46"/>
    <text x="242" y="99" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="12">▲ +6.42%</text>

    <!-- Sparkline / Trend Area -->
    <path d="M25 240 Q 80 260, 130 200 T 230 210 T 310 150 T 405 130 L 405 310 L 25 310 Z" fill="url(#greenWave)"/>
    <path d="M25 240 Q 80 260, 130 200 T 230 210 T 310 150 T 405 130" fill="none" stroke="#10b981" stroke-width="3"/>

    <!-- Timeframe Filters -->
    <g transform="translate(25, 325)">
      <rect x="0" y="0" width="40" height="25" rx="6" fill="#059669"/>
      <text x="12" y="17" fill="#ffffff" font-family="sans-serif" font-size="11">24H</text>
      <rect x="50" y="0" width="40" height="25" rx="6" fill="#064e3b"/>
      <text x="64" y="17" fill="#a7f3d0" font-family="sans-serif" font-size="11">7D</text>
      <rect x="100" y="0" width="40" height="25" rx="6" fill="#064e3b"/>
      <text x="112" y="17" fill="#a7f3d0" font-family="sans-serif" font-size="11">1M</text>
      <rect x="150" y="0" width="40" height="25" rx="6" fill="#064e3b"/>
      <text x="163" y="17" fill="#a7f3d0" font-family="sans-serif" font-size="11">1Y</text>
    </g>
  </g>

  <!-- Right: Top Movers & Live WebSockets Ticker -->
  <g transform="translate(500, 85)">
    <rect x="0" y="0" width="250" height="370" rx="14" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="20" y="35" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">MARKET PULSE</text>
    <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Top Movers (Live)</text>

    <!-- Item 1: ETH -->
    <g transform="translate(20, 85)">
      <circle cx="15" cy="15" r="14" fill="#627eea"/>
      <text x="11" y="20" fill="#fff" font-family="sans-serif" font-size="12">Ξ</text>
      <text x="40" y="14" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Ethereum</text>
      <text x="40" y="27" fill="#a7f3d0" font-family="sans-serif" font-size="10">$3,480.12</text>
      <text x="160" y="20" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">+4.18%</text>
    </g>

    <!-- Item 2: SOL -->
    <g transform="translate(20, 145)">
      <circle cx="15" cy="15" r="14" fill="#14f195"/>
      <text x="10" y="20" fill="#000" font-family="sans-serif" font-weight="bold" font-size="10">◎</text>
      <text x="40" y="14" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Solana</text>
      <text x="40" y="27" fill="#a7f3d0" font-family="sans-serif" font-size="10">$215.40</text>
      <text x="160" y="20" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">+11.2%</text>
    </g>

    <!-- Item 3: AVAX -->
    <g transform="translate(20, 205)">
      <circle cx="15" cy="15" r="14" fill="#e84142"/>
      <text x="10" y="20" fill="#fff" font-family="sans-serif" font-size="11">▲</text>
      <text x="40" y="14" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Avalanche</text>
      <text x="40" y="27" fill="#a7f3d0" font-family="sans-serif" font-size="10">$38.90</text>
      <text x="160" y="20" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">+8.45%</text>
    </g>

    <!-- Real-time badge -->
    <rect x="20" y="285" width="210" height="60" rx="8" fill="#064e3b" opacity="0.6"/>
    <circle cx="35" cy="315" r="5" fill="#10b981"/>
    <text x="48" y="312" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">WebSocket Connected</text>
    <text x="48" y="328" fill="#a7f3d0" font-family="sans-serif" font-size="10">Real-time async price feed</text>
  </g>
</svg>
