<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgPort)"/>

  <!-- Chrome Bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="#18181b" opacity="0.9"/>
  <circle cx="55" cy="45" r="6" fill="#ef4444"/>
  <circle cx="75" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="45" r="6" fill="#10b981"/>
  <rect x="130" y="35" width="380" height="20" rx="6" fill="#27272a"/>
  <text x="145" y="49" fill="#a1a1aa" font-family="sans-serif" font-size="11">https://devfolio-engine.design</text>

  <!-- Left: Code Editor Mockup -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="420" height="370" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <!-- Editor Tab -->
    <rect x="0" y="0" width="150" height="35" rx="8" fill="#18181b"/>
    <text x="20" y="22" fill="#f43f5e" font-family="monospace" font-size="11">★ theme.css</text>
    <line x1="0" y1="35" x2="420" y2="35" stroke="#27272a" stroke-width="1"/>

    <!-- Code lines -->
    <g transform="translate(20, 55)" font-family="'Fira Code', monospace" font-size="12">
      <text y="0" fill="#71717a">01  <tspan fill="#ec4899">:root</tspan> {</text>
      <text y="24" fill="#71717a">02    <tspan fill="#a855f7">--primary-glow</tspan>: <tspan fill="#38bdf8">#6366f1</tspan>;</text>
      <text y="48" fill="#71717a">03    <tspan fill="#a855f7">--bg-surface</tspan>: <tspan fill="#38bdf8">#0f172a</tspan>;</text>
      <text y="72" fill="#71717a">04    <tspan fill="#a855f7">--font-display</tspan>: <tspan fill="#10b981">'Syne', sans-serif</tspan>;</text>
      <text y="96" fill="#71717a">05  }</text>
      <text y="120" fill="#71717a">06</text>
      <text y="144" fill="#71717a">07  <tspan fill="#ec4899">.interactive-card</tspan> {</text>
      <text y="168" fill="#71717a">08    <tspan fill="#60a5fa">display</tspan>: flex;</text>
      <text y="192" fill="#71717a">09    <tspan fill="#60a5fa">backdrop-filter</tspan>: blur(16px);</text>
      <text y="216" fill="#71717a">10    <tspan fill="#60a5fa">transition</tspan>: all 0.3s ease;</text>
      <text y="240" fill="#71717a">11  }</text>
      <text y="264" fill="#71717a">12  <tspan fill="#71717a">// Dynamic CSS Variable Theme Switcher</tspan></text>
      <text y="288" fill="#71717a">13  <tspan fill="#f59e0b">function</tspan> <tspan fill="#60a5fa">setPalette</tspan>(mode) { ... }</text>
    </g>
  </g>

  <!-- Right: Theme Switcher & Palette Showcase -->
  <g transform="translate(490, 85)">
    <rect x="0" y="0" width="260" height="370" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="25" y="35" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="700">THEME ENGINE</text>
    <text x="25" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Live Palette Switcher</text>
    
    <!-- Color Swatches -->
    <g transform="translate(25, 80)">
      <circle cx="20" cy="20" r="16" fill="#6366f1"/>
      <circle cx="65" cy="20" r="16" fill="#06b6d4"/>
      <circle cx="110" cy="20" r="16" fill="#10b981"/>
      <circle cx="155" cy="20" r="16" fill="#ec4899"/>
      <circle cx="200" cy="20" r="16" fill="#f59e0b"/>
    </g>

    <!-- Mini Component Card -->
    <rect x="25" y="140" width="210" height="110" rx="10" fill="#27272a"/>
    <rect x="40" y="155" width="40" height="40" rx="8" fill="url(#neonGlow)"/>
    <text x="90" y="172" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Glass UI</text>
    <text x="90" y="190" fill="#a1a1aa" font-family="sans-serif" font-size="10">CSS3 Backdrop</text>
    <rect x="40" y="210" width="180" height="24" rx="6" fill="#3f3f46"/>
    <text x="95" y="226" fill="#e4e4e7" font-family="sans-serif" font-size="10">Preview Active</text>

    <!-- Specs pill -->
    <rect x="25" y="270" width="210" height="70" rx="8" fill="#09090b"/>
    <text x="40" y="295" fill="#a1a1aa" font-family="sans-serif" font-size="10">CORE STACK</text>
    <text x="40" y="320" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">HTML5 • CSS Custom Props • JS</text>
  </g>
</svg>
